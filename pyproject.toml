[project]
name = "groupalarm-ha-connect"
version = "0.5.3"
description = "Unofficial GroupAlarm integration for Home Assistant"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.6.0",
  "mypy==1.17.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.336",
  "ruff==0.12.5",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/groupalarm_ha_connect"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "ICN",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"scripts/anonymize_fixture.py" = ["T201"]
"scripts/check_repository.py" = ["T201"]
"tests/test_anonymize_fixture.py" = ["PT009"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["custom_components/groupalarm_ha_connect"]
