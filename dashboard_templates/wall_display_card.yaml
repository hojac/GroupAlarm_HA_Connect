# GroupAlarm HA Connect 0.5.3 - Wall Display
#
# Optional dependency: custom:button-card
#
# Replace every example entity ID below with the IDs from your installation.
# Entity IDs are installation-specific and are intentionally not derived from
# internal GroupAlarm IDs in this template.
#
# The feedback deadline is local to Home Assistant and starts when a new alarm
# ID with a personal WAITING state is detected. It is not the unknown
# GroupAlarm server notification time. Activity and location use validated
# current-alarm detail only.

type: vertical-stack
cards:
  - type: custom:button-card
    entity: binary_sensor.groupalarm_ha_connect_beispiel_aktive_alarmierung
    show_icon: false
    show_name: false
    show_label: false
    custom_fields:
      alarmzeit: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_alarmzeitpunkt']?.state;
          return `<span style="opacity:.75">Alarmzeit:</span> <b>${
            value && !['unknown', 'unavailable'].includes(value) ? value : 'Unbekannt'
          }</b>`;
        ]]]
      nummer: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_einsatznummer']?.state;
          return `<span style="opacity:.75">Einsatz:</span> <b>${
            value && !['unknown', 'unavailable'].includes(value) ? value : 'Kein Alarm'
          }</b>`;
        ]]]
      text: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_einsatzmeldung']?.state;
          return value && !['unknown', 'unavailable'].includes(value) ? value : '—';
        ]]]
    state:
      - value: "on"
        styles:
          card:
            - background-color: "#b71c1c"
          custom_fields:
            alarmzeit:
              - color: white
            nummer:
              - color: white
            text:
              - color: white
      - value: "unknown"
        styles:
          card:
            - border: 2px solid var(--warning-color)
      - value: "unavailable"
        styles:
          card:
            - opacity: 0.55
    styles:
      grid:
        - grid-template-areas: |
            "alarmzeit"
            "nummer"
            "text"
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content 1fr
      card:
        - min-height: 260px
        - padding: 20px
        - border-radius: 15px
      custom_fields:
        alarmzeit:
          - justify-self: start
          - font-size: 16px
          - margin-bottom: 8px
        nummer:
          - justify-self: start
          - font-size: 28px
          - font-weight: bold
          - margin-bottom: 16px
        text:
          - justify-self: start
          - align-self: start
          - text-align: left
          - white-space: normal
          - font-size: 22px
          - line-height: 1.4

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_positive
        name: Positiv
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - color: "#2e7d32"
            - font-size: 34px
            - font-weight: bold
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_negative
        name: Negativ
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - color: "#b71c1c"
            - font-size: 34px
            - font-weight: bold
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_offen
        name: Offen
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - font-size: 34px
            - font-weight: bold

  - type: custom:button-card
    entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldefrist_status
    name: Rückmeldefrist
    show_icon: false
    show_state: false
    tap_action:
      action: none
    variables:
      countdown_entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldefrist_countdown
    custom_fields:
      frist: |
        [[[
          const status = entity?.state;
          const raw = states[variables.countdown_entity]?.state;
          const numeric =
            typeof raw === 'string' &&
            raw.trim() !== '' &&
            Number.isFinite(Number(raw));

          if (status === 'answered') {
            return 'Rückmeldung erhalten';
          }
          if (status === 'known_active' && numeric) {
            return `${Math.max(0, Math.trunc(Number(raw)))} Sekunden`;
          }
          if (status === 'known_expired') {
            return 'Abgelaufen';
          }
          if (status === 'no_alarm') {
            return 'Kein Alarm';
          }
          return 'Unbekannt';
        ]]]
    styles:
      grid:
        - grid-template-areas: '"n" "frist"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content
      card:
        - padding: 16px
      name:
        - justify-self: start
        - font-size: var(--ha-card-header-font-size, 24px)
        - font-weight: normal
        - margin-bottom: 8px
      custom_fields:
        frist:
          - justify-self: start
          - text-align: left
          - color: |
              [[[
                const raw = states[variables.countdown_entity]?.state;
                const active =
                  entity?.state === 'known_active' &&
                  typeof raw === 'string' &&
                  raw.trim() !== '' &&
                  Number.isFinite(Number(raw));
                return active
                  ? 'var(--warning-color, #ff9800)'
                  : 'var(--primary-text-color)';
              ]]]
          - font-size: |
              [[[
                const raw = states[variables.countdown_entity]?.state;
                const active =
                  entity?.state === 'known_active' &&
                  typeof raw === 'string' &&
                  raw.trim() !== '' &&
                  Number.isFinite(Number(raw));
                return active ? '34px' : 'var(--ha-font-size-m, 14px)';
              ]]]
          - font-weight: |
              [[[
                return entity?.state === 'no_alarm' ? 'normal' : 'bold';
              ]]]

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: button.groupalarm_ha_connect_beispiel_komme
        name: Komme
        icon: mdi:check-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.groupalarm_ha_connect_beispiel_komme
        state:
          - value: "unavailable"
            styles:
              card:
                - opacity: 0.45
        styles:
          card:
            - height: 120px
            - border-radius: 15px
            - background-color: |
                [[[
                  return states[
                    'sensor.groupalarm_ha_connect_beispiel_meine_ruckmeldung'
                  ]?.state === 'komme'
                    ? '#2e7d32'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 42px
          name:
            - font-size: 20px
            - font-weight: bold

      - type: custom:button-card
        entity: button.groupalarm_ha_connect_beispiel_komme_nicht
        name: Komme nicht
        icon: mdi:close-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.groupalarm_ha_connect_beispiel_komme_nicht
        state:
          - value: "unavailable"
            styles:
              card:
                - opacity: 0.45
        styles:
          card:
            - height: 120px
            - border-radius: 15px
            - background-color: |
                [[[
                  return states[
                    'sensor.groupalarm_ha_connect_beispiel_meine_ruckmeldung'
                  ]?.state === 'komme_nicht'
                    ? '#b71c1c'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 42px
          name:
            - font-size: 20px
            - font-weight: bold

  - type: map
    title: Einsatzort
    show_all: false
    entities:
      - entity: device_tracker.groupalarm_ha_connect_beispiel_einsatzort
        name: Einsatzort
    hours_to_show: 1
    aspect_ratio: "1:1"
    default_zoom: 14
    theme_mode: auto
