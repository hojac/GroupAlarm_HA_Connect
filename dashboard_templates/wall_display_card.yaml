# GroupAlarm HA Connect 0.5.0 - Wall Display
#
# Optional dependency: custom:button-card
#
# Replace every example entity ID below with the IDs from your installation.
# Entity IDs are installation-specific and are intentionally not derived from
# internal GroupAlarm IDs in this template.
#
# The current evidence-backed mapper has no proven deadline, activity, feedback
# eligibility, or location path. The template therefore displays those states
# neutrally and relies on the actual button entities' availability.

type: vertical-stack
cards:
  - type: custom:button-card
    entity: binary_sensor.groupalarm_ha_connect_beispiel_aktive_alarmierung
    show_icon: false
    show_name: false
    show_label: false
    custom_fields:
      alarmzeit: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_alarmzeitpunkt']?.state;
          return `<span style="opacity:.75">Alarmzeit:</span> <b>${
            value && !['unknown', 'unavailable'].includes(value) ? value : 'Unbekannt'
          }</b>`;
        ]]]
      nummer: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_einsatznummer']?.state;
          return `<span style="opacity:.75">Einsatz:</span> <b>${
            value && !['unknown', 'unavailable'].includes(value) ? value : 'Kein Alarm'
          }</b>`;
        ]]]
      text: |
        [[[
          const value =
            states['sensor.groupalarm_ha_connect_beispiel_einsatzmeldung']?.state;
          return value && !['unknown', 'unavailable'].includes(value) ? value : '—';
        ]]]
    state:
      - value: "on"
        styles:
          card:
            - background-color: "#b71c1c"
          custom_fields:
            alarmzeit:
              - color: white
            nummer:
              - color: white
            text:
              - color: white
      - value: "unknown"
        styles:
          card:
            - border: 2px solid var(--warning-color)
      - value: "unavailable"
        styles:
          card:
            - opacity: 0.55
    styles:
      grid:
        - grid-template-areas: |
            "alarmzeit"
            "nummer"
            "text"
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content 1fr
      card:
        - min-height: 260px
        - padding: 20px
        - border-radius: 15px
      custom_fields:
        alarmzeit:
          - justify-self: start
          - font-size: 16px
          - margin-bottom: 8px
        nummer:
          - justify-self: start
          - font-size: 28px
          - font-weight: bold
          - margin-bottom: 16px
        text:
          - justify-self: start
          - align-self: start
          - text-align: left
          - white-space: normal
          - font-size: 22px
          - line-height: 1.4

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_positiv
        name: Positiv
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - color: "#2e7d32"
            - font-size: 34px
            - font-weight: bold
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_negativ
        name: Negativ
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - color: "#b71c1c"
            - font-size: 34px
            - font-weight: bold
      - type: custom:button-card
        entity: sensor.groupalarm_ha_connect_beispiel_ruckmeldungen_offen
        name: Offen
        show_icon: false
        show_state: true
        styles:
          card:
            - height: 90px
            - border-radius: 15px
          state:
            - font-size: 34px
            - font-weight: bold

  - type: markdown
    title: Rückmeldefrist
    content: >-
      {% set feedback =
        states('sensor.groupalarm_ha_connect_beispiel_meine_ruckmeldung') %}
      {% if feedback in ['komme', 'komme_nicht'] %}
      **Rückmeldung erhalten**
      {% elif feedback == 'no_alarm' %}
      Kein Alarm
      {% else %}
      **Unbekannt** – die persönliche Rückmeldefrist ist noch nicht
      durch eine reale, anonymisierte API-Payload belegt.
      {% endif %}

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: button.groupalarm_ha_connect_beispiel_komme
        name: Komme
        icon: mdi:check-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.groupalarm_ha_connect_beispiel_komme
        state:
          - value: "unavailable"
            styles:
              card:
                - opacity: 0.45
        styles:
          card:
            - height: 120px
            - border-radius: 15px
            - background-color: |
                [[[
                  return states[
                    'sensor.groupalarm_ha_connect_beispiel_meine_ruckmeldung'
                  ]?.state === 'komme'
                    ? '#2e7d32'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 42px
          name:
            - font-size: 20px
            - font-weight: bold

      - type: custom:button-card
        entity: button.groupalarm_ha_connect_beispiel_komme_nicht
        name: Komme nicht
        icon: mdi:close-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.groupalarm_ha_connect_beispiel_komme_nicht
        state:
          - value: "unavailable"
            styles:
              card:
                - opacity: 0.45
        styles:
          card:
            - height: 120px
            - border-radius: 15px
            - background-color: |
                [[[
                  return states[
                    'sensor.groupalarm_ha_connect_beispiel_meine_ruckmeldung'
                  ]?.state === 'komme_nicht'
                    ? '#b71c1c'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 42px
          name:
            - font-size: 20px
            - font-weight: bold

  - type: map
    title: Einsatzort
    show_all: false
    entities:
      - entity: device_tracker.groupalarm_ha_connect_beispiel_einsatzort
        name: Einsatzort
    hours_to_show: 1
    aspect_ratio: "1:1"
    default_zoom: 14
    theme_mode: auto
