name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14.2"
          enable-cache: true
          cache-python: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy custom_components/groupalarm_ha_connect

      - name: Pytest with coverage gate
        run: >-
          uv run pytest
          --cov=custom_components/groupalarm_ha_connect
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=95

      - name: Repository safety
        run: uv run python scripts/check_repository.py

  validate:
    name: Home Assistant and HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  release:
    name: Publish v0.5.1
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/rewrite/v0.5.0' &&
      github.event.head_commit.message == 'Release v0.5.1'
    needs:
      - quality
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        run: |
          test "$(jq -r '.version' custom_components/groupalarm_ha_connect/manifest.json)" = "0.5.1"
          grep -Fqx 'version = "0.5.1"' pyproject.toml
          grep -Fq 'INTEGRATION_VERSION: Final = "0.5.1"' custom_components/groupalarm_ha_connect/const.py
          grep -Fq '## [0.5.1] - 2026-07-29' CHANGELOG.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.1 >/dev/null 2>&1; then
            echo "Release v0.5.1 already exists."
            exit 0
          fi

          release_notes_file="${RUNNER_TEMP}/groupalarm-ha-connect-v0.5.1.md"
          cat > "${release_notes_file}" <<'EOF'
          ## GroupAlarm HA Connect v0.5.1

          Erste Feldtest-Version des vollständig asynchronen Neubaus.

          ### Enthalten

          - mehrere GroupAlarm-Organisationen pro Home-Assistant-Config-Entry
          - trafficarmer Alarmabruf und serverbestätigte persönliche Rückmeldungen
          - optionale Anfahrtszeit mit abgesichertem Feedback-Fallback
          - lokaler Rückmelde-Countdown aus dem Organisations-Timeout
          - Schreibsperre bei Countdown `0`, auch unmittelbar vor jedem POST
          - Diagnostics, Repairs, deutsche/englische Übersetzungen und Dashboard-Vorlage

          ### Voraussetzungen

          - Home Assistant `2026.6.0` oder neuer
          - persönlicher GroupAlarm Personal Access Token

          ### Bekannte Einschränkungen

          - Bei einem Home-Assistant-Neustart beginnt die lokale Frist für einen weiterhin
            auf `WAITING` stehenden Alarm neu.
          - Aktivstatus und Standort bleiben bis zu weiteren Feldtests teilweise
            `unknown` beziehungsweise `unavailable`.
          - Real- und Upgrade-Tests werden mit dieser Version fortgesetzt.
          EOF

          gh release create v0.5.1 \
            --target "${GITHUB_SHA}" \
            --title "GroupAlarm HA Connect v0.5.1" \
            --notes-file "${release_notes_file}" \
            --latest
